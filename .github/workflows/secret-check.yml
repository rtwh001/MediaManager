name: Secret check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan for token-like values
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/check-secrets.ps1
